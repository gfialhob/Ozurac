name: Validar tema

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxe JSON (package.json, temas e ícones)
        run: |
          for f in package.json themes/Ozurac.json themes/Ozurac-Soft.json ozurac-icons/ozurac-icons.json; do
            echo "Verificando $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Verificar sincronia do Ozurac Soft
        run: |
          npm run build:soft
          if ! git diff --exit-code themes/Ozurac-Soft.json; then
            echo "::error::themes/Ozurac-Soft.json está desatualizado em relação ao themes/Ozurac.json. Execute 'npm run build:soft' localmente."
            exit 1
          fi

      - name: Auditar ícones, mapeamentos e versão no CHANGELOG
        run: npm run validate

      - name: Verificar arquivos declarados em package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const paths = [
              pkg.icon,
              ...(pkg.contributes?.themes || []).map(t => t.path),
              ...(pkg.contributes?.iconThemes || []).map(i => i.path)
            ].filter(Boolean);
            const missing = paths.filter(p => !fs.existsSync(p));
            if (missing.length) {
              console.error('Arquivos declarados no package.json não encontrados:', missing);
              process.exit(1);
            }
            console.log('Todos os arquivos declarados no package.json existem.');
          "

      - name: Empacotar extensão (dry run)
        run: |
          npm install -g @vscode/vsce
          vsce package --no-dependencies -o /tmp/ozurac-dry-run.vsix